<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Quote of the Day</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

</head>
<body>

  <div class="wrap">
    <div class="eyebrow">Quote of the Day</div>

    <figure class="card" id="card">
      <span class="card-no" id="card-no">No. 01</span>
      <div class="quote-mark">&ldquo;</div>
      <blockquote id="quote-text">Click the stamp below to draw a quote.</blockquote>
      <figcaption id="quote-author">Your Card Catalog</figcaption>
      <hr class="rule">
      <div class="footer-row">
        <span id="quote-count">— of 16 in the drawer —</span>
        <span>est. today</span>
      </div>
    </figure>

    <button id="new-quote-btn" type="button">Draw Another</button>
  </div>

<script src="script.js"></script>
</body>
</html>
